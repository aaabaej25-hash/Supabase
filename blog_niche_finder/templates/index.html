<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>틈새 주제 추천</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; max-width: 720px; margin: 40px auto; color: #222; }
  h1 { font-size: 22px; }
  p.desc { color: #555; line-height: 1.6; }
  fieldset { border: 1px solid #ddd; border-radius: 8px; padding: 16px 20px; margin-top: 20px; }
  legend { padding: 0 8px; font-weight: bold; }
  input[type="url"] { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
  button { margin-top: 20px; padding: 10px 24px; background: #4C72B0; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
  button:hover { background: #3a5a8a; }
  .loading { display: none; margin-top: 14px; color: #4C72B0; }
</style>
</head>
<body>
  <h1>경쟁 블로그 분석 &amp; 틈새 주제 추천</h1>
  <p class="desc">
    설정된 검색 키워드와 RSS 경쟁 블로그를 기본으로 분석합니다.<br>
    아래에 <strong>분석하고 싶은 블로그 링크를 3~5개(선택)</strong> 입력하면 함께 분석 대상에 추가됩니다.
    (네이버 블로그 링크, RSS 주소를 지원합니다)
  </p>

  <form action="/analyze" method="post" onsubmit="document.getElementById('loading').style.display='block';">
    <fieldset>
      <legend>추가 분석 링크 (선택, 최대 {{ max_links }}개)</legend>
      {% for i in range(1, max_links + 1) %}
      <input type="url" name="url{{ i }}" placeholder="https://blog.naver.com/아이디  또는 RSS 주소">
      {% endfor %}
    </fieldset>
    <button type="submit">분석 시작</button>
    <div class="loading" id="loading">분석 중입니다... (검색/RSS 수집에 최대 1~2분 소요될 수 있습니다)</div>
  </form>
</body>
</html>
